<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Destiny Wheel Custom Picker</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .focus-ring:focus { outline: 3px solid #f59e0b; outline-offset: 2px; }
  #confetti-canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }
</style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
<canvas id="confetti-canvas" aria-hidden="true"></canvas>

<div class="max-w-4xl mx-auto px-4 py-6">
  <h1 class="text-3xl font-bold text-center text-amber-400 mb-1">Destiny Wheel</h1>
  <p class="text-center text-gray-400 text-sm mb-6">Add items · Spin · Let fate decide</p>

  <div class="grid md:grid-cols-2 gap-6">
    <!-- Wheel -->
    <div class="flex flex-col items-center">
      <div class="relative mb-4">
        <!-- Pointer -->
        <div class="absolute -right-3 top-1/2 -translate-y-1/2 z-10" aria-hidden="true">
          <div style="width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-right:28px solid #f59e0b;filter:drop-shadow(0 0 4px #f59e0b);"></div>
        </div>
        <canvas id="wheel" width="320" height="320" class="rounded-full" role="img" aria-label="Destiny wheel"></canvas>
      </div>
      <button id="spin-btn" class="focus-ring bg-amber-500 hover:bg-amber-400 active:scale-95 text-gray-900 font-black text-lg px-10 py-3 rounded-2xl transition transform shadow-lg" aria-label="Spin the wheel">🎯 SPIN!</button>
      <div id="winner-banner" class="hidden mt-4 bg-amber-500 text-gray-900 font-bold text-xl px-6 py-3 rounded-2xl text-center shadow-lg" role="alert" aria-live="assertive"></div>
    </div>

    <!-- Controls -->
    <div class="flex flex-col gap-4">
      <!-- Add item -->
      <div class="bg-gray-800 rounded-2xl p-4">
        <h2 class="font-semibold text-gray-300 mb-3 text-sm uppercase tracking-widest">Add Item</h2>
        <div class="flex gap-2 mb-3">
          <input id="item-input" type="text" class="focus-ring flex-1 bg-gray-700 border border-gray-600 rounded-xl px-3 py-2 text-white placeholder-gray-500 text-sm" placeholder="Enter item name…" maxlength="40" aria-label="Item name">
          <button id="add-btn" class="focus-ring bg-amber-600 hover:bg-amber-500 text-white font-bold px-4 py-2 rounded-xl transition text-sm" aria-label="Add item">Add</button>
        </div>
        <div class="flex items-center gap-2">
          <label for="weight-slider" class="text-xs text-gray-400 whitespace-nowrap">Weight: <span id="weight-val">1</span></label>
          <input type="range" id="weight-slider" min="1" max="5" value="1" class="flex-1 accent-amber-500 focus-ring" aria-label="Item weight">
        </div>
      </div>

      <!-- Options -->
      <div class="bg-gray-800 rounded-2xl p-4 flex items-center justify-between">
        <label for="remove-toggle" class="text-sm text-gray-300">Remove winner after spin</label>
        <button role="switch" id="remove-toggle" class="focus-ring relative w-12 h-6 rounded-full transition bg-gray-600" aria-checked="false">
          <span id="toggle-knob" class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform"></span>
        </button>
      </div>

      <!-- Item list -->
      <div class="bg-gray-800 rounded-2xl p-4 flex-1">
        <h2 class="font-semibold text-gray-300 mb-3 text-sm uppercase tracking-widest">Items (<span id="item-count">0</span>/20)</h2>
        <div id="item-list" class="space-y-1 max-h-48 overflow-y-auto pr-1" aria-label="Items list"></div>
      </div>

      <!-- History -->
      <div class="bg-gray-800 rounded-2xl p-4">
        <h2 class="font-semibold text-gray-300 mb-2 text-sm uppercase tracking-widest">Last 10 Spins</h2>
        <div id="history-list" class="space-y-1 text-sm text-gray-400 max-h-28 overflow-y-auto" aria-label="Spin history"></div>
      </div>
    </div>
  </div>
</div>

<script>
const COLORS = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e91e63','#00bcd4','#ff5722','#8bc34a','#ff9800','#607d8b','#795548','#009688','#673ab7','#ef5350','#42a5f5','#66bb6a','#ffa726'];

let items = JSON.parse(localStorage.getItem('destinyItems') || '[]');
let history = JSON.parse(localStorage.getItem('destinyHistory') || '[]');
let removeWinner = false;
let spinning = false;
let currentAngle = 0;

if (!items.length) items = [
  {name:'Option A',weight:1},{name:'Option B',weight:1},{name:'Option C',weight:1},
  {name:'Option D',weight:2},{name:'Option E',weight:1}
];

function saveItems() { localStorage.setItem('destinyItems', JSON.stringify(items)); }
function saveHistory() { localStorage.setItem('destinyHistory', JSON.stringify(history)); }

function getTotalWeight() { return items.reduce((s,i)=>s+i.weight,0); }

function drawWheel(angle=0) {
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const cx = canvas.width/2, cy = canvas.height/2, r = cx-4;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if (!items.length) {
    ctx.fillStyle='#374151'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#9ca3af'; ctx.font='16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('Add items to spin!', cx, cy);
    return;
  }

  const total = getTotalWeight();
  let startAngle = angle;

  items.forEach((item, i) => {
    const slice = (item.weight / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, startAngle + slice);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();
    ctx.strokeStyle = '#1f2937';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Label
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + slice/2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(14, Math.max(9, 120/items.length))}px sans-serif`;
    ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=4;
    const maxW = r * 0.6;
    const name = item.name.length > 14 ? item.name.slice(0,13)+'…' : item.name;
    ctx.fillText(name, r-8, 4);
    ctx.restore();
    startAngle += slice;
  });

  // Center circle
  ctx.beginPath(); ctx.arc(cx,cy,20,0,Math.PI*2);
  ctx.fillStyle='#1f2937'; ctx.fill();
  ctx.strokeStyle='#f59e0b'; ctx.lineWidth=3; ctx.stroke();
}

function getWinnerAtAngle(angle) {
  if (!items.length) return null;
  const total = getTotalWeight();
  // pointer is at angle 0 (right side after canvas rotation)
  // normalize angle to [0, 2π)
  let a = ((-angle) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  let cum = 0;
  for (let i=0; i<items.length; i++) {
    cum += (items[i].weight/total)*Math.PI*2;
    if (a < cum) return i;
  }
  return items.length-1;
}

function spin() {
  if (spinning || items.length < 2) return;
  spinning = true;
  document.getElementById('spin-btn').disabled = true;
  document.getElementById('winner-banner').classList.add('hidden');

  const extraSpins = 5 + Math.random() * 5;
  const extraAngle = Math.random() * Math.PI * 2;
  const targetAngle = currentAngle + extraSpins * Math.PI * 2 + extraAngle;
  const duration = 3000 + Math.random() * 1500;
  const startAngle = currentAngle;
  const startTime = performance.now();

  function easeOut(t) { return 1 - Math.pow(1-t, 4); }

  function animate(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed/duration, 1);
    currentAngle = startAngle + (targetAngle - startAngle) * easeOut(t);
    drawWheel(currentAngle);
    if (t < 1) { requestAnimationFrame(animate); return; }
    currentAngle = targetAngle % (Math.PI*2);
    spinning = false;
    document.getElementById('spin-btn').disabled = false;

    const winIdx = getWinnerAtAngle(currentAngle);
    if (winIdx === null) return;
    const winner = items[winIdx];
    showWinner(winner.name, winIdx);
    history.unshift({name: winner.name, time: new Date().toLocaleTimeString()});
    if (history.length > 10) history.pop();
    saveHistory(); renderHistory();
    if (removeWinner) {
      items.splice(winIdx, 1);
      saveItems(); renderItems(); drawWheel(currentAngle);
    }
    launchConfetti();
  }
  requestAnimationFrame(animate);
}

function showWinner(name, idx) {
  const banner = document.getElementById('winner-banner');
  banner.textContent = `🎉 ${name}!`;
  banner.style.background = COLORS[idx % COLORS.length];
  banner.classList.remove('hidden');
}

function renderItems() {
  const list = document.getElementById('item-list');
  list.innerHTML = '';
  document.getElementById('item-count').textContent = items.length;
  items.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'flex items-center gap-2 py-1';
    row.innerHTML = `
      <span class="w-3 h-3 rounded-sm flex-shrink-0" style="background:${COLORS[i%COLORS.length]}" aria-hidden="true"></span>
      <span class="flex-1 text-sm text-gray-200 truncate">${item.name}</span>
      <span class="text-xs text-amber-400 font-mono w-4">×${item.weight}</span>
      <button class="focus-ring text-gray-500 hover:text-red-400 transition px-1 text-lg leading-none" data-idx="${i}" aria-label="Remove ${item.name}">×</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('[data-idx]').forEach(btn => {
    btn.addEventListener('click', () => {
      items.splice(parseInt(btn.dataset.idx), 1);
      saveItems(); renderItems(); drawWheel(currentAngle);
    });
  });
}

function renderHistory() {
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  if (!history.length) { list.innerHTML = '<span class="text-gray-500 text-xs">No spins yet</span>'; return; }
  history.forEach(h => {
    const div = document.createElement('div');
    div.className = 'flex justify-between';
    div.innerHTML = `<span class="text-amber-300 font-medium">${h.name}</span><span class="text-gray-500">${h.time}</span>`;
    list.appendChild(div);
  });
}

// Confetti
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const particles = Array.from({length:120}, () => ({
    x: Math.random()*canvas.width, y: Math.random()*canvas.height*0.5-50,
    vx: (Math.random()-0.5)*6, vy: Math.random()*4+2,
    color: COLORS[Math.floor(Math.random()*COLORS.length)],
    size: Math.random()*8+4, rot: Math.random()*360, rotV: (Math.random()-0.5)*10,
    life: 1
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    particles.forEach(p => {
      if (p.life <= 0) return; alive=true;
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.rot+=p.rotV; p.life-=0.012;
      ctx.save(); ctx.globalAlpha=p.life;
      ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
      ctx.restore();
    });
    if (alive && frame++<300) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  requestAnimationFrame(draw);
}

// Toggle
const removeToggle = document.getElementById('remove-toggle');
const toggleKnob = document.getElementById('toggle-knob');
removeToggle.addEventListener('click', () => {
  removeWinner = !removeWinner;
  removeToggle.setAttribute('aria-checked', removeWinner);
  removeToggle.style.background = removeWinner ? '#f59e0b' : '';
  toggleKnob.style.transform = removeWinner ? 'translateX(24px)' : '';
});

// Add item
document.getElementById('weight-slider').addEventListener('input', function() {
  document.getElementById('weight-val').textContent = this.value;
});

function addItem() {
  const input = document.getElementById('item-input');
  const name = input.value.trim();
  if (!name || items.length >= 20) return;
  const weight = parseInt(document.getElementById('weight-slider').value);
  items.push({name, weight});
  input.value = '';
  saveItems(); renderItems(); drawWheel(currentAngle);
}

document.getElementById('add-btn').addEventListener('click', addItem);
document.getElementById('item-input').addEventListener('keydown', e => { if (e.key==='Enter') addItem(); });
document.getElementById('spin-btn').addEventListener('click', spin);

// Init
renderItems(); renderHistory(); drawWheel(currentAngle);
</script>
</body>
</html>
